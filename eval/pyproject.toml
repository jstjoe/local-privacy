[project]
name = "opf-eval"
version = "0.1.0"
description = "Benchmark harness comparing OPF and Skyflow Detect"
license = "AGPL-3.0-or-later"
license-files = ["../LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "opf",
    "httpx>=0.27",
    "datasets>=2.20",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "presidio-analyzer>=2.2",
    "gliner>=0.2.13",
    "nervaluate>=0.2,<0.3",
    "openmed[hf]>=0.1",
]

[project.scripts]
opf-eval-ensemble = "opf_eval.ensemble:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opf_eval"]

[tool.uv.sources]
opf = { workspace = true }
