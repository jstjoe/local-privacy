[project]
name = "opf-eval"
version = "0.1.0"
description = "Benchmark harness comparing OPF and Skyflow Detect"
license = "AGPL-3.0-or-later"
license-files = ["../LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "opf",
    "httpx>=0.27",
    "datasets>=2.20",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "presidio-analyzer>=2.2",
    "gliner>=0.2.29",  # first release that accepts transformers >= 5.10 (Clef-flash)
    # GLiNER's mdeberta tokenizer needs protobuf to convert spm.model; gliner
    # 0.2.29 no longer pulls it in.
    "protobuf>=4.25",
    "nervaluate>=0.2,<0.3",
    "openmed[hf]>=0.1",
    "typing_extensions>=4.5; python_version < '3.11'",
]

[project.optional-dependencies]
# Extra libraries the notebooks/ series uses (charts, search demo).
# (IPython is deliberately not listed: Colab pins its own version.)
notebooks = [
    "matplotlib>=3.7",
    "bm25s>=0.2",
]
# File parsing for notebook 07 (PDF, Word, Excel; CSV/TXT/MD/HTML/EML use the stdlib).
files = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
# LLM labellers and reviewers: Anthropic API + Vertex AI, OpenAI API + OpenAI-compatible servers.
llm = [
    "anthropic[vertex]",
    "openai",
    "google-auth>=2.0",
]
# Local Clef-flash classifier review. Clef-flash needs transformers >= 5.10.2
# (Qwen3.5 backbone); 8-bit loading on a T4 needs bitsandbytes (CUDA only).
# torchvision is deliberately not listed: the latest release would pull a newer
# torch for every detector. Colab ships it; without it ClefBackend loads the
# tokenizer only, which is all text review needs.
clef = [
    "transformers>=5.10.2",
    "pillow",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
]

[project.scripts]
opf-eval-ensemble = "opf_eval.ensemble:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opf_eval"]

[tool.uv.sources]
opf = { git = "https://github.com/openai/privacy-filter", rev = "f7f00ca7fb869683eb732c010299d901457f19c3" }

[tool.pytest.ini_options]
markers = [
    "slow: tests that build small models or fetch files from the Hugging Face Hub",
]
