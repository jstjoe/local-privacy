# Cloud Run service spec — apply via:
#   gcloud run services replace api/deploy/cloudrun.yaml --region=us-central1
#
# Substitutes (replace before applying, or use envsubst):
#   PROJECT_ID  — GCP project
#   REGION      — Artifact Registry region (us-central1)
#   IMAGE_TAG   — git tag or short SHA built by .github/workflows/release.yml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: privacy-api
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 4
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/privacy/api:IMAGE_TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: DEFAULT_DETECTOR
              value: opf
            - name: EAGER_LOAD
              value: opf
            - name: REQUEST_TIMEOUT_SECONDS
              value: "30"
            - name: SHUTDOWN_DRAIN_SECONDS
              value: "20"
            - name: LOG_LEVEL
              value: INFO
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: privacy-api-keys
                  key: latest
            - name: SKYFLOW_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: skyflow-token
                  key: latest
            - name: SKYFLOW_VAULT_URL
              valueFrom:
                secretKeyRef:
                  name: skyflow-vault-url
                  key: latest
            - name: SKYFLOW_VAULT_ID
              valueFrom:
                secretKeyRef:
                  name: skyflow-vault-id
                  key: latest
          startupProbe:
            httpGet:
              path: /v1/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
