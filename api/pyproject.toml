[project]
name = "opf-api"
version = "0.1.0"
description = "FastAPI server wrapping the OPF privacy filter"
requires-python = ">=3.10"
dependencies = [
    "opf",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opf_api"]

[tool.uv.sources]
opf = { workspace = true }
