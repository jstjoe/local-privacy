[project]
name = "opf-api"
version = "0.2.0"
description = "Unified privacy-detection API — one contract, multiple backends"
requires-python = ">=3.10"
dependencies = [
    "opf",
    "opf-eval",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
gliner = ["gliner>=0.2.13"]
presidio = ["presidio-analyzer>=2.2"]
all = ["gliner>=0.2.13", "presidio-analyzer>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opf_api"]

[tool.uv.sources]
opf = { workspace = true }
opf-eval = { workspace = true }
